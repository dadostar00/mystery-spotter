name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # pipeline di ingestione, integrazione app → contratto, vincoli PostgreSQL (PGlite)
      - run: npm test
      - run: npm run build

  analytics:
    name: Analytics (Python · DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: pip install -r analytics/requirements.txt
      - run: python analytics/kpi_report.py --md kpi_report.md
      - uses: actions/upload-artifact@v4
        with:
          name: kpi-report
          path: kpi_report.md
